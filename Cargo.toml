[package]
name = "sig-exchange"
version = "0.1.0"
edition = "2024"

[dependencies]
alpm-srcinfo = { version = "0.4.0", default-features = false }
alpm-types = "0.8.0"
anyhow = "1.0.100"
clap = { version = "4.5.49", features = ["derive"] }
env_logger = "0.11.8"
log = "0.4.28"
sequoia-openpgp = "2.0.0"
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros", "fs"] }
