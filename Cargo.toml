[package]
name = "sig-exchange"
version = "0.1.0"
edition = "2024"

[dependencies]
alpm-srcinfo = { version = "0.4.0", default-features = false }
alpm-types = "0.8.0"
anyhow = "1.0.100"
async-compression = { version = "0.4.32", features = ["bzip2", "tokio", "xz"] }
clap = { version = "4.5.49", features = ["derive"] }
deb822-fast = "0.2.0"
dotenvy = "0.15.7"
env_logger = "0.11.8"
log = "0.4.28"
sequoia-openpgp = { version = "2.0.0", features = ["allow-experimental-crypto", "allow-variable-time-crypto", "crypto-rust"], default-features = false }
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres"] }
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros", "fs"] }
tokio-stream = "0.1.17"
tokio-tar = "0.3.1"
