[package]
name = "sig-exchange"
version = "0.1.0"
edition = "2024"

[dependencies]
alpm-srcinfo = { version = "0.4.0", default-features = false }
alpm-types = "0.8.0"
anyhow = "1.0.100"
async-compression = { version = "0.4.32", features = ["bzip2", "tokio", "xz"] }
blake3 = "1.8.2"
bytes = "1.10.1"
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.5.49", features = ["derive", "env"] }
deb822-fast = "0.2.0"
debian-changelog = "0.2.1"
dotenvy = "0.15.7"
env_logger = "0.11.8"
handlebars = { version = "6.3.2", features = ["rust-embed"] }
log = "0.4.28"
reqwest = { version = "0.12.24", default-features = false, features = ["rustls-tls-webpki-roots", "socks", "stream"] }
rust-embed = "8.7.2"
sequoia-openpgp = { version = "2.0.0", features = ["allow-experimental-crypto", "allow-variable-time-crypto", "crypto-rust"], default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres", "chrono"] }
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros", "fs"] }
tokio-stream = "0.1.17"
tokio-tar = "0.3.1"
tokio-util = "0.7.16"
warp = { version = "0.4.2", features = ["server"] }
